name: Benchmarks

on:
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/benchmarks.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  benchmark:
    name: Benchmarks (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
          - label: linux-arm64
            runner: ubuntu-24.04-arm
          - label: macos-arm64
            runner: macos-latest
          - label: windows-amd64
            runner: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run curated benchmark suite
        shell: bash
        run: |
          chmod +x scripts/bench.sh
          ./scripts/bench.sh
          
          # Verify benchmark output was created
          if [ ! -f "benchmarks/latest.json" ]; then
            echo "Error: Benchmark script did not create benchmarks/latest.json"
            ls -la benchmarks/ || echo "benchmarks/ directory not found"
            exit 1
          fi
          
          echo "✓ Benchmark suite completed successfully"

      - name: Run extension benchmarks
        shell: bash
        run: |
          echo "🧩 Running extension benchmarks..."
          
          # Run extension-specific benchmarks
          go test -bench="BenchmarkRegExp|BenchmarkDuration|BenchmarkInterval|BenchmarkTimestamp|BenchmarkUUID|BenchmarkFieldIndex|BenchmarkTypedVsStandard|BenchmarkMarshalAuto|BenchmarkExtension" \
            -benchmem -benchtime=1s -run=^$ \
            -timeout 5m \
            > benchmarks/extensions_bench.txt 2>&1 || true
          
          echo "✓ Extension benchmarks completed"

      - name: Generate test coverage report
        shell: bash
        run: |
          echo "📊 Generating test coverage..."
          
          # Run tests with coverage
          go test -coverprofile=benchmarks/coverage.out . 2>&1 | tee benchmarks/test_output.txt
          
          # Generate coverage HTML
          go tool cover -html=benchmarks/coverage.out -o benchmarks/coverage.html || true
          
          # Generate coverage summary
          go tool cover -func=benchmarks/coverage.out > benchmarks/coverage_summary.txt || true
          
          # Extract coverage percentage
          COVERAGE=$(go tool cover -func=benchmarks/coverage.out | grep "total:" | awk '{print $3}' || echo "N/A")
          echo "Coverage: $COVERAGE"
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
          
          echo "✓ Coverage report generated"

      - name: Install plotting dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Render benchmark chart
        shell: bash
        run: |
          # Verify JSON exists and is valid before plotting
          if [ ! -f "benchmarks/latest.json" ]; then
            echo "Error: benchmarks/latest.json not found"
            exit 1
          fi
          
          # Check if JSON is valid and has results
          python <<'PY'
          import json
          import sys
          import io
          from pathlib import Path
          
          # Fix Windows encoding issues
          if sys.platform == 'win32':
              sys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')
              sys.stderr = io.TextIOWrapper(sys.stderr.buffer, encoding='utf-8')
          
          json_path = Path("benchmarks/latest.json")
          try:
              data = json.loads(json_path.read_text(encoding="utf-8"))
              results = data.get("results", [])
              if not results:
                  print("Error: No results found in benchmarks/latest.json", file=sys.stderr)
                  sys.exit(1)
              print(f"[OK] Found {len(results)} benchmark results")
          except Exception as e:
              print(f"Error validating JSON: {e}", file=sys.stderr)
              sys.exit(1)
          PY
          
          # Now generate the chart
          python scripts/plot_benchmarks.py benchmarks/latest.json benchmarks/latest.png

      - name: Organize outputs by CPU
        id: organize
        shell: bash
        run: |
          python <<'PY'
          import json
          import re
          import shutil
          import sys
          import io
          from pathlib import Path

          # Fix Windows encoding issues
          if sys.platform == 'win32':
              sys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')
              sys.stderr = io.TextIOWrapper(sys.stderr.buffer, encoding='utf-8')

          json_path = Path("benchmarks/latest.json")
          if not json_path.exists():
              raise SystemExit("benchmarks/latest.json not found")

          data = json.loads(json_path.read_text(encoding="utf-8"))
          env = data.get("environment", {})
          cpu = (env.get("cpu") or "unknown-cpu").strip()
          os_name = (env.get("os") or "unknown-os").strip()
          slug_source = f"{os_name}-{cpu}" if cpu else os_name
          slug = re.sub(r"[^A-Za-z0-9]+", "-", slug_source).strip('-').lower() or "unknown"

          dest = Path("benchmarks") / slug
          if dest.exists():
              shutil.rmtree(dest)
          dest.mkdir(parents=True, exist_ok=True)

          for ext in ("md", "json", "png"):
              src = Path("benchmarks") / f"latest.{ext}"
              if src.exists():
                  shutil.move(str(src), dest / f"benchmark.{ext}")

          metadata = {
              "slug": slug,
              "cpu": cpu,
              "os": os_name,
          }

          Path("cpu_metadata.json").write_text(json.dumps(metadata), encoding="utf-8")
          PY

          cpu_slug=$(python <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("cpu_metadata.json").read_text(encoding="utf-8"))
          print(data["slug"])
          PY
          )
          cpu_name=$(python <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("cpu_metadata.json").read_text(encoding="utf-8"))
          print(data["cpu"])
          PY
          )
          os_name=$(python <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("cpu_metadata.json").read_text(encoding="utf-8"))
          print(data["os"])
          PY
          )
          rm -f cpu_metadata.json
          echo "cpu_slug=${cpu_slug}" >> "$GITHUB_OUTPUT"
          echo "cpu_name=${cpu_name}" >> "$GITHUB_OUTPUT"
          echo "os_name=${os_name}" >> "$GITHUB_OUTPUT"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ steps.organize.outputs.cpu_slug }}
          path: benchmarks/${{ steps.organize.outputs.cpu_slug }}

      - name: Upload extension benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: extensions-${{ steps.organize.outputs.cpu_slug }}
          path: |
            benchmarks/extensions_bench.txt
            benchmarks/coverage.out
            benchmarks/coverage.html
            benchmarks/coverage_summary.txt
            benchmarks/test_output.txt
          if-no-files-found: ignore

  aggregate:
    name: Aggregate Results
    runs-on: ubuntu-latest
    needs: benchmark
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies for aggregation
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib numpy

      - name: Compose multi-platform summary
        shell: bash
        run: |
          # Use the dedicated aggregation script for better maintainability
          python scripts/aggregate_benchmarks.py
          
          # Aggregate extension benchmarks
          echo "🧩 Aggregating extension benchmarks..."
          python - <<'PYEND'
          import os
          from pathlib import Path
          import json
          
          artifacts_dir = Path("artifacts")
          extensions_summary = {}
          
          # Collect extension benchmark results
          for ext_dir in artifacts_dir.glob("extensions-*"):
              platform = ext_dir.name.replace("extensions-", "")
              bench_file = ext_dir / "extensions_bench.txt"
              coverage_file = ext_dir / "coverage_summary.txt"
              
              if bench_file.exists():
                  extensions_summary[platform] = {
                      "benchmark": bench_file.read_text(encoding="utf-8", errors="ignore"),
                  }
              
              if coverage_file.exists():
                  coverage_text = coverage_file.read_text(encoding="utf-8", errors="ignore")
                  # Extract total coverage
                  for line in coverage_text.split("\n"):
                      if "total:" in line:
                          extensions_summary[platform]["coverage"] = line.split()[-1]
                          break
          
          # Save extensions summary
          dist_dir = Path("dist")
          dist_dir.mkdir(exist_ok=True)
          (dist_dir / "extensions_summary.json").write_text(
              json.dumps(extensions_summary, indent=2),
              encoding="utf-8"
          )
          
          print(f"✓ Aggregated extension data for {len(extensions_summary)} platforms")
          PYEND

      - name: Generate multi-platform charts
        shell: bash
        run: |
          # Generate unified comparison charts
          python scripts/plot_multi_platform.py dist/charts
          
          # Verify charts were created
          if [ -f "dist/charts/multi_platform_comparison.png" ]; then
            echo "✅ Multi-platform comparison chart created"
          else
            echo "⚠️  Warning: Multi-platform chart not created"
          fi

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: dist

      - name: Copy results to benchmarks directory
        shell: bash
        run: |
          mkdir -p benchmarks
          
          # Copy all platform-specific benchmark directories
          if [ -d "dist/benchmarks" ]; then
            cp -r dist/benchmarks/* benchmarks/ 2>/dev/null || true
          fi
          
          # Copy the consolidated multi-platform report
          if [ -f "dist/MULTI_PLATFORM.md" ]; then
            cp dist/MULTI_PLATFORM.md benchmarks/MULTI_PLATFORM.md
            echo "✅ Copied multi-platform summary"
          else
            echo "⚠️  Warning: dist/MULTI_PLATFORM.md not found"
          fi
          
          # Copy extension benchmarks summary
          if [ -f "dist/extensions_summary.json" ]; then
            cp dist/extensions_summary.json benchmarks/extensions_summary.json
            echo "✅ Copied extension benchmarks summary"
          fi
          fi
          
          # List what we have
          echo "📁 Benchmark directory contents:"
          ls -la benchmarks/

      - name: Commit and push results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "📊 Update multi-platform benchmark results [skip ci]"
          git push origin main

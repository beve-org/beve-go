name: Benchmarks

on:
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/benchmarks.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  benchmark:
    name: Benchmarks (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
          - label: linux-arm64
            runner: ubuntu-24.04-arm
          - label: macos-arm64
            runner: macos-latest
          - label: windows-amd64
            runner: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run curated benchmark suite
        shell: bash
        run: |
          chmod +x scripts/bench.sh
          ./scripts/bench.sh

      - name: Install plotting dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib

      - name: Render benchmark chart
        shell: bash
        run: |
          python scripts/plot_benchmarks.py benchmarks/latest.json benchmarks/latest.png

      - name: Organize outputs by CPU
        id: organize
        shell: bash
        run: |
          python <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          json_path = Path("benchmarks/latest.json")
          if not json_path.exists():
              raise SystemExit("benchmarks/latest.json not found")

          data = json.loads(json_path.read_text(encoding="utf-8"))
          env = data.get("environment", {})
          cpu = (env.get("cpu") or "unknown-cpu").strip()
          os_name = (env.get("os") or "unknown-os").strip()
          slug_source = f"{os_name}-{cpu}" if cpu else os_name
          slug = re.sub(r"[^A-Za-z0-9]+", "-", slug_source).strip('-').lower() or "unknown"

          dest = Path("benchmarks") / slug
          if dest.exists():
              shutil.rmtree(dest)
          dest.mkdir(parents=True, exist_ok=True)

          for ext in ("md", "json", "png"):
              src = Path("benchmarks") / f"latest.{ext}"
              if src.exists():
                  shutil.move(str(src), dest / f"benchmark.{ext}")

          metadata = {
              "slug": slug,
              "cpu": cpu,
              "os": os_name,
          }

          Path("cpu_metadata.json").write_text(json.dumps(metadata), encoding="utf-8")
          PY

          cpu_slug=$(python <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("cpu_metadata.json").read_text(encoding="utf-8"))
          print(data["slug"])
          PY
          )
          cpu_name=$(python <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("cpu_metadata.json").read_text(encoding="utf-8"))
          print(data["cpu"])
          PY
          )
          os_name=$(python <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("cpu_metadata.json").read_text(encoding="utf-8"))
          print(data["os"])
          PY
          )
          rm -f cpu_metadata.json
          echo "cpu_slug=${cpu_slug}" >> "$GITHUB_OUTPUT"
          echo "cpu_name=${cpu_name}" >> "$GITHUB_OUTPUT"
          echo "os_name=${os_name}" >> "$GITHUB_OUTPUT"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ steps.organize.outputs.cpu_slug }}
          path: benchmarks/${{ steps.organize.outputs.cpu_slug }}

  aggregate:
    name: Aggregate Results
    runs-on: ubuntu-latest
    needs: benchmark
    steps:
      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compose multi-platform summary
        shell: bash
        run: |
          python <<'PY'
          import json
          import shutil
          from pathlib import Path

          artifacts_root = Path("artifacts")
          dist_root = Path("dist")
          bench_root = dist_root / "benchmarks"
          bench_root.mkdir(parents=True, exist_ok=True)

          summary_lines = ["# Multi-Platform Benchmark Results", "", "| CPU | OS | Artifacts |", "|-----|----|-----------|"]
          detail_lines = []

          def format_value(value):
              if isinstance(value, (int, float)):
                  if isinstance(value, float):
                      return f"{value:.2f}"
                  return str(value)
              if value in (None, ""):
                  return "n/a"
              return str(value)

          for json_path in sorted(artifacts_root.glob("**/benchmarks/*/benchmark.json")):
              cpu_dir = json_path.parent
              slug = cpu_dir.name
              data = json.loads(json_path.read_text(encoding="utf-8"))
              env = data.get("environment", {})
              cpu_name = env.get("cpu", slug)
              os_name = env.get("os", "unknown")

              dest_dir = bench_root / slug
              if dest_dir.exists():
                  shutil.rmtree(dest_dir)
              dest_dir.mkdir(parents=True, exist_ok=True)

              for artifact_file in cpu_dir.glob("benchmark.*"):
                  shutil.copy2(artifact_file, dest_dir / artifact_file.name)

              summary_lines.append(
                  f"| {cpu_name} | {os_name} | [Markdown](benchmarks/{slug}/benchmark.md) · [JSON](benchmarks/{slug}/benchmark.json) · [PNG](benchmarks/{slug}/benchmark.png) |"
              )

              grouped = {}
              order = []
              for entry in data.get("results", []):
                  key = (entry.get("scenario", ""), entry.get("operation", ""))
                  if key not in grouped:
                      grouped[key] = []
                      order.append(key)
                  grouped[key].append(entry)

              detail_lines.extend([f"## {cpu_name} — {os_name}", "", "| Scenario | Codec | Operation | ns/op | B/op | allocs/op |", "|----------|-------|-----------|-------|------|-----------|"])
              for key in order:
                  scenario, operation = key
                  entries = sorted(
                      grouped[key],
                      key=lambda e: (float("inf") if e.get("ns_per_op") in (None, "n/a") else e["ns_per_op"])  # type: ignore[arg-type]
                  )
                  for entry in entries:
                      detail_lines.append(
                          "| {scenario} | {codec} | {operation} | {ns} | {bytes} | {allocs} |".format(
                              scenario=scenario,
                              codec=entry.get("codec", ""),
                              operation=operation,
                              ns=format_value(entry.get("ns_per_op")),
                              bytes=format_value(entry.get("bytes_per_op")),
                              allocs=format_value(entry.get("allocs_per_op")),
                          )
                      )

              detail_lines.append("")

          if not detail_lines:
              detail_lines.append("No benchmark results were found.")

          summary_lines.append("")
          summary_lines.extend(detail_lines)

          summary_path = dist_root / "results.md"
          summary_path.write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          PY

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: dist
